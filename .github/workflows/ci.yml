  mutation-summary:
    outputs:
      changed-coverage-state: ${{ steps.mutation-aggregate.outputs.changed-coverage-state }}
    name: Aggregate mutation shard evidence
    needs:
      - mutation-plan
      - checks
      - mutations
      - mutation-engine
      - mutation-engine-default
      - mutation-windows
      - mutation-host
    if: ${{ always() && needs.mutation-plan.result == 'success' && (needs.checks.outputs.mutation-mode == 'sharded' || needs.checks.outputs.mutation-engine-count != '0' || needs.checks.outputs.mutation-engine-default-count != '0' || needs.mutation-plan.outputs.mutation-host-count != '0') && (inputs.artifact-key != '' || github.repository_id != '1382744803') }}
