          path: ${{ runner.temp }}/engine-default-mutants
          merge-multiple: false
      - name: Download native Windows mutation evidence
        if: ${{ always() && needs.checks.outputs.mutation-windows != '[]' && (needs.checks.outputs.mutation-engine-count != '0' || needs.checks.outputs.mutation-engine-default-count != '0' || needs.mutation-plan.outputs.mutation-host-count != '0') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.checks.outputs.artifact-name }}-windows-mutants
          path: ${{ runner.temp }}/windows-mutants
      - name: Download complete host mutation receipts
        if: ${{ always() && needs.mutation-plan.outputs.mutation-host-count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
