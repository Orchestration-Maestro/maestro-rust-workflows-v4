name: Rust CI
# Contract: Locked Rust checks, 90% line coverage, security scans, SBOMs and release artifacts
'on':
  # The organization's rust-ci ruleset requires this file on every pull
  # request of a Rust repository, in that repository's context: a run no
  # workflow called takes its inputs from `[ci]` in maestro-quality.toml.
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Relative package/workspace directory inside checkout; must contain
          `Cargo.toml`, `Cargo.lock`, `rust-toolchain.toml`
        type: string
        default: .
      rust-version:
        description: >-
          Exact stable version, `1.85.0` or newer; empty uses
          `rust-toolchain.toml`
        type: string
        default: ''
      coverage-threshold:
        description: >-
          Finite minimum line percentage, from the organization's floor of 90 to 100
        type: number
        default: 90
      artifact-key:
        description: >-
          Invocation identity, 1 to 40 alphanumeric/underscore/hyphen
          characters, starting alphanumeric
        type: string
        default: ci
      license-policy:
        description: >-
          Kept for the repositories that set it: `auto` and `enforce` both
          apply the organization's licence and source policy; `off` is
          refused, since no repository opts out
        type: string
        default: auto
      mutation-test:
        description: >-
          Run cargo-mutants and fail on surviving mutants; a pull request
          mutates its diff, a push or tag its own commit
        type: boolean
        default: true
      mutation-shards:
        description: >-
          `1` keeps one inline run without discovery, `0` selects all mutants
          automatically up to GitHub's 256-job matrix limit and fails if the
          target needs more, while `2` through `256` request a fixed shard count
        type: number
        default: 1
      mutation-mutants-per-shard:
        description: >-
          Automatic mode target mutants per shard, an adjustable calibration
          knob from `1` to `1000`, not a time guarantee
        type: number
        default: 50
      mutation-windows:
        description: >-
          JSON array of exact files relative to `working-directory` owned by Windows mutation testing
        type: string
        default: '[]'
      coverage-features:
        description: >-
          JSON array of package/feature strings for merged default and feature coverage;
          empty reads the tested head's [ci] coverage-features policy
        type: string
        default: ''
      mutation-engine:
        description: >-
          JSON object with package-local features and exact relative Rust files;
          empty reads the tested head's [ci.mutation-engine] policy
        type: string
        default: ''
      internal-shard-selftest:
        description: >-
          Internal to this repository's own CI only: create a behavior-equivalent
          workspace diff and require its two-shard mutation matrix. Refused for
          every other repository.
        type: boolean
        default: false
      sarif-reports:
        description: >-
          Also emit Clippy and secret findings as SARIF, which the
          organization's check uploads to code scanning
        type: boolean
        default: true
      clippy-level:
        description: >-
          `pedantic` or `nursery` also deny those Clippy groups
        type: string
        default: default
      dependency-audit:
        description: >-
          Require a recorded cargo-vet audit for every dependency, the
          organization's and five public audit sets imported (VET-001)
        type: boolean
        default: true
      unsafe-policy:
        description: >-
          Refuses an `unsafe` block in any workspace member; `allow` leaves the
          decision to a project that needs it
        type: string
        default: deny
      unused-dependencies:
        description: >-
          Fail when a workspace member declares a dependency it never uses;
          remove it or set `false`
        type: boolean
        default: true
      platforms:
        description: >-
          Also build and test on `macos`, `windows` and `linux-arm`,
          space-separated; see [platform portability](#platform-portability)
        type: string
        default: ''
      api-compatibility:
        description: >-
          Fail a pull request that breaks a library's public API without `!`
          after the type in its title; see [public API
          compatibility](#public-api-compatibility)
        type: boolean
        default: true
    outputs:
      artifact-id:
        description: >-
          Immutable GitHub release artifact ID in the current run; available
          only after the required gate
        value: ${{ jobs.gate.outputs.artifact-id }}
      artifact-name:
        description: >-
          Exact artifact name for downstream verification
        value: ${{ jobs.gate.outputs.artifact-name }}
      revision:
        description: >-
          The checked source SHA
        value: ${{ jobs.gate.outputs.revision }}
permissions:
  contents: read
# Supersede only the same caller, directory, key and compiler, not another
# toolchain in the matrix. Pull requests cancel; other runs finish, and GitHub
# keeps only the newest waiting run per group. Each tag is its own group.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}-${{ inputs.artifact-key }}-${{ inputs.rust-version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  mutation-plan:
    name: Plan mutation routing
    # Forks run too: CI takes no secret and a read-only token, and the
    # organization holds external contributors' runs for approval. Inside
    # this repository, only a caller runs it: its root holds no Cargo package.
    # The repository is found by its id, which a rename leaves alone.
    if: ${{ github.event_name != 'pull_request_target' && (inputs.artifact-key != '' || github.repository_id != '1382744803') }}
    runs-on: ubuntu-24.04
    # Retain the checks hang ceiling; discovery does not compile native engines.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CARGO_MUTANTS_VERSION: '27.1.0'
    outputs:
      artifact-name: ${{ steps.validate.outputs.artifact-name }}
      revision: ${{ github.sha }}
      directory: ${{ steps.validate.outputs.directory }}
      platforms: ${{ steps.validate.outputs.platforms }}
      toolchain: ${{ steps.validate.outputs.toolchain }}
      mutation-mode: ${{ steps.mutants-plan.outputs.mutation-mode }}
      mutation-count: ${{ steps.mutants-plan.outputs.mutation-count }}
      mutation-shards: ${{ steps.mutants-plan.outputs.mutation-shards }}
      mutation-matrix: ${{ steps.mutants-plan.outputs.mutation-matrix }}
      mutation-test: ${{ steps.validate.outputs.mutation-test }}
      mutation-mutants-per-shard: ${{ steps.validate.outputs.mutation-mutants-per-shard }}
      mutation-host-count: ${{ steps.mutants-plan.outputs.mutation-host-count }}
      mutation-host-files: ${{ steps.validate.outputs.mutation-host-files }}
      mutation-attempt: ${{ github.run_attempt }}
      mutation-windows: ${{ steps.validate.outputs.mutation-windows }}
      coverage-features: ${{ steps.validate.outputs.coverage-features }}
      mutation-engine-policy: ${{ steps.validate.outputs.mutation-engine-policy }}
      mutation-engine-features: ${{ steps.validate.outputs.mutation-engine-features }}
      mutation-engine-files: ${{ steps.validate.outputs.mutation-engine-files }}
      mutation-engine-count: ${{ steps.mutants-plan.outputs.mutation-engine-count }}
      mutation-engine-shards: ${{ steps.mutants-plan.outputs.mutation-engine-shards }}
      mutation-engine-matrix: ${{ steps.mutants-plan.outputs.mutation-engine-matrix }}
      mutation-engine-default-count: ${{ steps.mutants-plan.outputs.mutation-engine-default-count }}
      mutation-engine-default-shards: ${{ steps.mutants-plan.outputs.mutation-engine-default-shards }}
      mutation-engine-default-matrix: ${{ steps.mutants-plan.outputs.mutation-engine-default-matrix }}
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      # Replaces the gate's checkout: another repository's is deleted first.
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Mutation testing diffs the commit against its first parent: the base
          # branch of a pull request's merge commit, or the previous commit of a
          # push or tag. A run no workflow called reads its settings there.
          fetch-depth: 2
      # Before validate: a run no workflow called reads its settings from
      # maestro-quality.toml through jaq.
      - name: Install the settings reader
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Validate consumer inputs
        id: validate
        env:
          CALLED: ${{ inputs.artifact-key != '' }}
          DIRECTORY: ${{ inputs.working-directory }}
          REQUESTED_TOOLCHAIN: ${{ inputs.rust-version }}
          COVERAGE: ${{ inputs.coverage-threshold }}
          ARTIFACT_KEY: ${{ inputs.artifact-key }}
          LICENSE_POLICY: ${{ inputs.license-policy }}
          MUTATION_TEST: ${{ inputs.mutation-test }}
          MUTATION_SHARDS: ${{ inputs.mutation-shards }}
          MUTATION_MUTANTS_PER_SHARD: ${{ inputs.mutation-mutants-per-shard }}
          MUTATION_ENGINE_POLICY: ${{ inputs.mutation-engine }}
          COVERAGE_FEATURES: ${{ inputs.coverage-features }}
          MUTATION_WINDOWS: ${{ inputs.mutation-windows }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          API_COMPATIBILITY: ${{ inputs.api-compatibility }}
          PLATFORMS: ${{ inputs.platforms }}
          SARIF_REPORTS: ${{ inputs.sarif-reports }}
          UNUSED_DEPENDENCIES: ${{ inputs.unused-dependencies }}
          UNSAFE_POLICY: ${{ inputs.unsafe-policy }}
          DEPENDENCY_AUDIT: ${{ inputs.dependency-audit }}
          CLIPPY_LEVEL: ${{ inputs.clippy-level }}
        run: rust-gate validate
      - name: Configure private Cargo state for direct crates.io access
        id: registry
        run: rust-gate registry
      - name: Install the mutation testing tool
        if: ${{ env.MUTATION_TEST == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-mutants sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e cargo-mutants
      - name: Install the toolchain
        id: tools
        run: rust-gate tools
      - name: Plan mutation shard routing
        id: mutants-plan
        env:
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          MUTATION_ENGINE_FILES: ${{ steps.validate.outputs.mutation-engine-files }}
          MUTATION_WINDOWS: ${{ steps.validate.outputs.mutation-windows }}
          MUTATION_ENGINE_FEATURES: ${{ steps.validate.outputs.mutation-engine-features }}
        run: rust-gate mutants-plan
      - name: Upload immutable mutation planning reports
        id: plan-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.validate.outputs.artifact-name }}-plan
          path: ${{ runner.temp }}/rust-reports/
          if-no-files-found: error
          retention-days: 7

  checks:
    name: Rust CI checks
    needs:
      - mutation-plan
    # Forks run too: CI takes no secret and a read-only token, and the
    # organization holds external contributors' runs for approval. Inside
    # this repository, only a caller runs it: its root holds no Cargo package.
    # The repository is found by its id, which a rename leaves alone.
    if: ${{ github.event_name != 'pull_request_target' && (inputs.artifact-key != '' || github.repository_id != '1382744803') }}
    runs-on: ubuntu-24.04
    # Cold native coverage, API comparisons and per-feature checks need separate builds.
    # Pi has no CI-job timeout; this is a hang ceiling, not an expected duration.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CARGO_MUTANTS_VERSION: '27.1.0'
    outputs:
      artifact-name: ${{ steps.validate.outputs.artifact-name }}
      revision: ${{ github.sha }}
      directory: ${{ steps.validate.outputs.directory }}
      platforms: ${{ steps.validate.outputs.platforms }}
      toolchain: ${{ steps.validate.outputs.toolchain }}
      mutation-mode: ${{ needs.mutation-plan.outputs.mutation-mode }}
      mutation-count: ${{ needs.mutation-plan.outputs.mutation-count }}
      mutation-shards: ${{ needs.mutation-plan.outputs.mutation-shards }}
      mutation-matrix: ${{ needs.mutation-plan.outputs.mutation-matrix }}
      mutation-test: ${{ steps.validate.outputs.mutation-test }}
      mutation-mutants-per-shard: ${{ steps.validate.outputs.mutation-mutants-per-shard }}
      mutation-host-count: ${{ needs.mutation-plan.outputs.mutation-host-count }}
      mutation-host-files: ${{ needs.mutation-plan.outputs.mutation-host-files }}
      mutation-attempt: ${{ github.run_attempt }}
      mutation-windows: ${{ steps.validate.outputs.mutation-windows }}
      coverage-features: ${{ steps.validate.outputs.coverage-features }}
      mutation-engine-policy: ${{ steps.validate.outputs.mutation-engine-policy }}
      mutation-engine-features: ${{ steps.validate.outputs.mutation-engine-features }}
      mutation-engine-files: ${{ steps.validate.outputs.mutation-engine-files }}
      mutation-engine-count: ${{ needs.mutation-plan.outputs.mutation-engine-count }}
      mutation-engine-shards: ${{ needs.mutation-plan.outputs.mutation-engine-shards }}
      mutation-engine-matrix: ${{ needs.mutation-plan.outputs.mutation-engine-matrix }}
      mutation-engine-default-count: ${{ needs.mutation-plan.outputs.mutation-engine-default-count }}
      mutation-engine-default-shards: ${{ needs.mutation-plan.outputs.mutation-engine-default-shards }}
      mutation-engine-default-matrix: ${{ needs.mutation-plan.outputs.mutation-engine-default-matrix }}
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      # Replaces the gate's checkout: another repository's is deleted first.
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Mutation testing diffs the commit against its first parent: the base
          # branch of a pull request's merge commit, or the previous commit of a
          # push or tag. A run no workflow called reads its settings there.
          fetch-depth: 2
      # Before validate: a run no workflow called reads its settings from
      # maestro-quality.toml through jaq.
      - name: Install the settings reader
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Validate consumer inputs
        id: validate
        env:
          CALLED: ${{ inputs.artifact-key != '' }}
          DIRECTORY: ${{ inputs.working-directory }}
          REQUESTED_TOOLCHAIN: ${{ inputs.rust-version }}
          COVERAGE: ${{ inputs.coverage-threshold }}
          ARTIFACT_KEY: ${{ inputs.artifact-key }}
          LICENSE_POLICY: ${{ inputs.license-policy }}
          MUTATION_TEST: ${{ inputs.mutation-test }}
          MUTATION_SHARDS: ${{ inputs.mutation-shards }}
          MUTATION_MUTANTS_PER_SHARD: ${{ inputs.mutation-mutants-per-shard }}
          MUTATION_ENGINE_POLICY: ${{ inputs.mutation-engine }}
          COVERAGE_FEATURES: ${{ inputs.coverage-features }}
          MUTATION_WINDOWS: ${{ inputs.mutation-windows }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          API_COMPATIBILITY: ${{ inputs.api-compatibility }}
          PLATFORMS: ${{ inputs.platforms }}
          SARIF_REPORTS: ${{ inputs.sarif-reports }}
          UNUSED_DEPENDENCIES: ${{ inputs.unused-dependencies }}
          UNSAFE_POLICY: ${{ inputs.unsafe-policy }}
          DEPENDENCY_AUDIT: ${{ inputs.dependency-audit }}
          CLIPPY_LEVEL: ${{ inputs.clippy-level }}
        run: rust-gate validate
      - name: Configure private Cargo state for direct crates.io access
        id: registry
        run: rust-gate registry
      - name: Restore Cargo registry and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # Keyed on the resolved dependency graph and the selected compiler, so a
          # lockfile or toolchain change can never reuse an incompatible build.
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ runner.temp }}/rust-target
          key: rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.PROJECT)) }}
          restore-keys: |
            rust-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Install verified tools
        id: install
        run: rust-gate install-tools
        env:
          # Verified prebuilt releases instead of `cargo install`: building these
          # from source cost every caller minutes of compile time on every job,
          # multiplied by the compiler matrix. Each asset is pinned by checksum.
          TOOLS: |
            # gungraun's runner counts the declared benchmarks' instructions
            # (PRF-001); it must match the gungraun the benchmarks link.
            gungraun-runner gungraun/gungraun/releases/download/v0.19.4/gungraun-runner-v0.19.4-x86_64-unknown-linux-gnu.tar.gz f88194dac725ef0599b2812396518e9bd74aadaf75f5baf78df91ddb9eec67d3 gungraun-runner-v0.19.4-x86_64-unknown-linux-gnu/gungraun-runner
            gitleaks gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks
            cargo-llvm-cov taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a cargo-llvm-cov
            cargo-audit rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
            # cargo-deny holds the default dependency policy for every project, and
            # a committed deny.toml on top.
            cargo-deny EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
            # similarity-rs lists the pairs of functions whose syntax trees match,
            # what the duplication step reports, and refuses from three alike.
            similarity-rs mizchi/similarity/releases/download/v0.5.0/similarity-v0.5.0-x86_64-unknown-linux-gnu.tar.gz 2afda6201b6afb1ee36c1ce51b95a538ec99310c79f661905536d917470a406a similarity-v0.5.0-x86_64-unknown-linux-gnu/similarity-rs
            # cargo-hack builds each declared feature on its own. Whether a workspace
            # has features is a property of its manifests, not of an input, so this
            # one cannot be deferred behind a flag the caller sets.
            cargo-hack taiki-e/cargo-hack/releases/download/v0.6.45/cargo-hack-x86_64-unknown-linux-musl.tar.gz b242dffcfd43317ac484dd2dbc3b9fc5f8a7eb3ba252af31b531503f0bad33d1 cargo-hack
            # nextest runs each test in its own process and writes JUnit, which
            # cargo test does not; the doc tests stay on cargo test, which is the
            # one thing nextest does not run.
            cargo-nextest nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa cargo-nextest
      # Optional gates download only when selected; every consumer otherwise
      # pays their run time for a tool the invocation never uses. validate
      # exported each selection, whether a caller or `[ci]` made it.
      - name: Install the mutation testing tool
        if: ${{ env.MUTATION_TEST == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-mutants sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e cargo-mutants
      - name: Install the API compatibility checker
        if: ${{ env.API_COMPATIBILITY == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-semver-checks obi1kenobi/cargo-semver-checks/releases/download/v0.50.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz 52a65dc88dc53fa8b57d6087954eb52cda149ca03bcfca78ce3fdecd23f893c4 cargo-semver-checks
      - name: Install the SARIF converter
        if: ${{ env.SARIF_REPORTS == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: clippy-sarif psastras/sarif-rs/releases/download/clippy-sarif-v0.8.0/clippy-sarif-x86_64-unknown-linux-gnu d97c49a32e50c294437dbfdb764a6ced94c386ee5d45d82ba881694cc6d77329
      - name: Install the unused-dependency tool
        if: ${{ env.UNUSED_DEPENDENCIES == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-machete bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9 cargo-machete-v0.9.2-x86_64-unknown-linux-musl/cargo-machete
      - name: Install the dependency audit tool
        if: ${{ env.DEPENDENCY_AUDIT == 'true' }}
        run: rust-gate install-tools
        env:
          TOOLS: cargo-vet mozilla/cargo-vet/releases/download/v0.10.0/cargo-vet-x86_64-unknown-linux-gnu.tar.xz c7664d9db5dd2ff813f20303650ac8253fa712ff2a1ea9ce12bed71e346f1744 cargo-vet-x86_64-unknown-linux-gnu/cargo-vet
      - name: Install the toolchain
        id: tools
        run: rust-gate tools
      - name: Source rules ARC, SIZE, NAME, DOC, LIB, TST, WSP and LNT
        id: architecture
        run: rust-gate architecture
      - name: Repository hygiene HYG and the width of shell scripts
        id: hygiene
        run: rust-gate hygiene
      - name: Managed files as the organization renders them
        id: managed-files
        run: rust-gate managed-files
      - name: Commit hooks over every file
        id: hooks
        env:
          # The step installs the toolbelt `rust-gate setup` installs, prek
          # and every hook's tool; mise asks GitHub's API for each release's
          # attestations, and an anonymous runner shares its rate limit with
          # every other job on its address.
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: rust-gate hooks
      - name: Formatting, Clippy and tests
        id: quality
        run: rust-gate quality
      - name: Function and file sizes, never blocking
        id: complexity
        run: rust-gate complexity
      - name: Duplicated functions, pairs reported and three alike refused
        id: duplication
        run: rust-gate duplication
      - name: Prepare private native cache restore
        id: native-cache-prepare
        if: ${{ env.COVERAGE_FEATURES != '' }}
        run: rust-gate native-cache-prepare
        env:
          NATIVE_CACHE_MODE: coverage
          NATIVE_CACHE_OS: ${{ runner.os }}
          NATIVE_CACHE_ARCH: ${{ runner.arch }}
      - name: Restore published native entries
        id: native-cache-restore
        if: ${{ steps.native-cache-prepare.outputs.enabled == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.native-cache-prepare.outputs.paths }}
          key: ${{ steps.native-cache-prepare.outputs.key }}
          restore-keys: |
            ${{ steps.native-cache-prepare.outputs.bucket }}-coverage-
            ${{ steps.native-cache-prepare.outputs.bucket }}-
          enableCrossOsArchive: false
      - name: Line coverage gate
        id: coverage
        run: rust-gate coverage
        env:
          NATIVE_CACHE_ROOT: ${{ steps.native-cache-prepare.outputs.root }}
      - name: Download immutable mutation planning reports
        id: checks-plan-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-plan
          path: ${{ runner.temp }}/rust-reports
      - name: Coverage of the lines a pull request adds
        id: changed-coverage
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: rust-gate changed-coverage
      - name: Dependency vulnerability audit
        id: audit
        run: rust-gate audit
      - name: Licence, dependency-ban and source policy
        id: licenses
        env:
          LICENSE_ALLOWLIST: ${{ vars.LICENSE_ALLOWLIST }}
        run: rust-gate licenses
      - name: Mutation testing
        id: mutants
        if: ${{ needs.mutation-plan.outputs.mutation-mode != 'sharded' }}
        env:
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          MUTATION_ENGINE_FILES: ${{ steps.validate.outputs.mutation-engine-files }}
          MUTATION_WINDOWS: ${{ steps.validate.outputs.mutation-windows }}
        run: rust-gate mutants
      - name: Instruction counts of the declared benchmarks against the base
        id: performance
        run: rust-gate performance
      - name: Public API compatibility
        id: api
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          NATIVE_CACHE_ROOT: ${{ steps.native-cache-prepare.outputs.root }}
        run: rust-gate api
      - name: Redacted source secret scan
        id: secrets
        run: rust-gate secrets
      - name: Declared minimum supported Rust version
        id: msrv
        run: rust-gate msrv
      - name: Every declared feature compiles
        id: features
        env:
          NATIVE_CACHE_ROOT: ${{ steps.native-cache-prepare.outputs.root }}
        run: rust-gate features
      - name: Unused declared dependencies
        id: unused
        run: rust-gate unused
      - name: Recorded dependency audits
        id: vet
        run: rust-gate vet
      # Last of the checks: a title or a branch outside the conventions must
      # not hide what the checks above would say.
      - name: Pull request rules PRL
        id: pull-request
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: rust-gate pull-request
      - name: Build quality scorecard
        id: scorecard
        if: ${{ always() && steps.validate.outcome == 'success' }}
        env:
          OUT_QUALITY: ${{ steps.quality.outcome }}
          OUT_COVERAGE: ${{ steps.coverage.outcome }}
          OUT_AUDIT: ${{ steps.audit.outcome }}
          OUT_SECRETS: ${{ steps.secrets.outcome }}
          OUT_MSRV: ${{ steps.msrv.outcome }}
          OUT_FEATURES: ${{ steps.features.outcome }}
          OUT_LICENCES: ${{ steps.licenses.outcome }}
          MUTATION_HOST_COUNT: ${{ needs.mutation-plan.outputs.mutation-host-count }}
          OUT_MUTANTS: ${{ steps.mutants.outcome }}
          OUT_UNUSED: ${{ steps.unused.outcome }}
          OUT_BUILD: skipped
          OUT_HARDENING: skipped
          OUT_STAGE: skipped
          FEATURES_APPLIED: ${{ steps.features.outputs.applied }}
          MUTANTS_APPLIED: ${{ steps.mutants.outputs.applied }}
          OUT_API: ${{ steps.api.outcome }}
          API_APPLIED: ${{ steps.api.outputs.applied }}
          OUT_ARCHITECTURE: ${{ steps.architecture.outcome }}
          OUT_HYGIENE: ${{ steps.hygiene.outcome }}
          OUT_MANAGED_FILES: ${{ steps.managed-files.outcome }}
          OUT_HOOKS: ${{ steps.hooks.outcome }}
          HOOKS_APPLIED: ${{ steps.hooks.outputs.applied }}
          OUT_DUPLICATION: ${{ steps.duplication.outcome }}
          OUT_CHANGED_COVERAGE: ${{ steps.changed-coverage.outcome }}
          CHANGED_COVERAGE_APPLIED: ${{ steps.changed-coverage.outputs.applied }}
          OUT_PULL_REQUEST: ${{ steps.pull-request.outcome }}
          PULL_REQUEST_APPLIED: ${{ steps.pull-request.outputs.applied }}
          OUT_VET: ${{ steps.vet.outcome }}
          OUT_PERFORMANCE: ${{ steps.performance.outcome }}
          PERFORMANCE_APPLIED: ${{ steps.performance.outputs.applied }}
        run: rust-gate scorecard
      - name: Upload diagnostic reports
        if: ${{ always() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.validate.outputs.artifact-name }}-${{ (needs.mutation-plan.outputs.mutation-mode == 'sharded' || needs.mutation-plan.outputs.mutation-engine-count != '0' || needs.mutation-plan.outputs.mutation-engine-default-count != '0' || needs.mutation-plan.outputs.mutation-host-count != '0') && 'checks-reports' || 'reports' }}
          path: ${{ runner.temp }}/rust-reports/
          if-no-files-found: error
          retention-days: 7
      - name: Upload inline mutation outcomes for partition aggregation
        if: ${{ always() && needs.mutation-plan.outputs.mutation-mode == 'inline' && (needs.mutation-plan.outputs.mutation-engine-count != '0' || needs.mutation-plan.outputs.mutation-engine-default-count != '0' || needs.mutation-plan.outputs.mutation-host-count != '0') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.validate.outputs.artifact-name }}-default-mutants
          path: ${{ runner.temp }}/mutants/mutants.out/
          if-no-files-found: error
          retention-days: 7
      - name: Check native cache save inventory
        id: native-cache-inventory
        if: ${{ success() && steps.native-cache-prepare.outputs.enabled == 'true' }}
        run: rust-gate native-cache-inventory
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          JOB_SUCCESS: 'true'
          NATIVE_CACHE_ROOT: ${{ steps.native-cache-prepare.outputs.root }}
      - name: Save published native entries
        id: native-cache-save
        if: ${{ success() && steps.native-cache-inventory.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.native-cache-inventory.outputs.paths }}
          key: ${{ steps.native-cache-prepare.outputs.key }}
          enableCrossOsArchive: false

  release:
    name: Release and hardening checks
    needs:
      - mutation-plan
    runs-on: ubuntu-24.04
    # Same hang ceiling as checks, which these steps ran under before; a hang still fails the job.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      PROJECT: ${{ github.workspace }}/${{ needs.mutation-plan.outputs.directory }}
      REPORTS: ${{ github.workspace }}/rust-reports
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust-target
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ needs.mutation-plan.outputs.artifact-name }}
      revision: ${{ github.sha }}
      out-build: ${{ steps.build.outcome }}
      out-hardening: ${{ steps.hardening.outcome }}
      out-stage: ${{ steps.stage.outcome }}
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        id: release-gate-build
        uses: ./.github/actions/gate
      # Replaces the gate's checkout: another repository's is deleted first.
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure private Cargo state for direct crates.io access
        run: rust-gate registry
      - name: Install verified tools
        run: rust-gate install-tools
        env:
          TOOLS: |
            jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
            cargo-cyclonedx CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8 cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx
            cyclonedx CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
            cargo-auditable rust-secure-code/cargo-auditable/releases/download/v0.7.6/cargo-auditable-x86_64-unknown-linux-gnu.tar.xz 4b5b009ad799409bdaf70210e2e4d0ff00e415a78621949a88fb81a63f60ff48 cargo-auditable-x86_64-unknown-linux-gnu/cargo-auditable
            cargo-sbom psastras/sbom-rs/releases/download/cargo-sbom-v0.10.0/cargo-sbom-x86_64-unknown-linux-gnu 860a50d3e009c72fefc12506869cc11ea34d240c65da65cda2c491ed2aaa34f3
      - name: Install the toolchain
        run: rust-gate tools
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - name: Release build, verified packages and SBOMs
        id: build
        run: rust-gate build
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - name: Reproducible build and binary hardening
        id: hardening
        run: rust-gate hardening
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - name: Stage immutable release payload
        id: stage
        run: rust-gate stage
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - name: Upload release payload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/rust-release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload release diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-release-reports
          path: ${{ github.workspace }}/rust-reports/
          if-no-files-found: error
          retention-days: 7

  mutations:
    name: Mutation shard ${{ matrix.shard }} of ${{ needs.mutation-plan.outputs.mutation-shards }}
    needs:
      - mutation-plan
    if: ${{ needs.mutation-plan.result == 'success' && needs.mutation-plan.outputs.mutation-mode == 'sharded' }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.mutation-matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_MUTANTS_VERSION: '27.1.0'
      MUTATION_ENGINE_POLICY: ${{ needs.mutation-plan.outputs.mutation-engine-policy }}
      MUTATION_ENGINE_FEATURES: ${{ needs.mutation-plan.outputs.mutation-engine-features }}
      MUTATION_ENGINE_FILES: ${{ needs.mutation-plan.outputs.mutation-engine-files }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.mutation-plan.outputs.directory }}
    steps:
      - name: Checkout the gate at this workflow's commit
        id: mutation-gate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        id: mutation-gate-build
        uses: ./.github/actions/gate
      - name: Checkout the exact consumer revision and first parent
        id: mutation-consumer-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install the settings reader
        id: mutation-settings-reader
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Configure private Cargo state for direct crates.io access
        id: mutation-registry
        run: rust-gate registry
      - name: Validate consumer inputs
        id: mutation-validate
        env:
          CALLED: 'true'
          DIRECTORY: ${{ needs.mutation-plan.outputs.directory }}
          REQUESTED_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
          COVERAGE: '90'
          COVERAGE_FEATURES: ${{ needs.mutation-plan.outputs.coverage-features }}
          ARTIFACT_KEY: mutation-worker
          LICENSE_POLICY: auto
          MUTATION_TEST: ${{ needs.mutation-plan.outputs.mutation-test }}
          MUTATION_SHARDS: ${{ needs.mutation-plan.outputs.mutation-shards }}
          MUTATION_MUTANTS_PER_SHARD: ${{ needs.mutation-plan.outputs.mutation-mutants-per-shard }}
          MUTATION_WINDOWS: ${{ needs.mutation-plan.outputs.mutation-windows }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          API_COMPATIBILITY: 'false'
          PLATFORMS: ''
          SARIF_REPORTS: 'false'
          UNUSED_DEPENDENCIES: 'false'
          UNSAFE_POLICY: allow
          DEPENDENCY_AUDIT: 'false'
          CLIPPY_LEVEL: default
        run: rust-gate validate
      - name: Restore the worker-local Cargo build cache
        id: mutation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ runner.temp }}/rust-target
          key: rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', env.PROJECT)) }}
          restore-keys: |
            rust-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Install the toolchain
        id: mutation-toolchain
        run: rust-gate tools
      - name: Install cargo-mutants and cargo-nextest
        id: mutation-tools
        run: rust-gate install-tools
        env:
          TOOLS: |
            cargo-mutants sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e cargo-mutants
            cargo-mutants windows sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-pc-windows-msvc.zip 2a2f00e47d4b458262a41501b0820aa26015fd35779903d2c8b30b2993f36791 zip cargo-mutants.exe
            cargo-nextest nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa cargo-nextest
      - name: Download this run's immutable mutation plan
        id: mutation-plan-download
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-plan
          path: ${{ runner.temp }}/mutation-plan
      - name: Mutation testing
        id: mutation-worker-run
        timeout-minutes: 35
        env:
          MUTATION_TEST: ${{ needs.mutation-plan.outputs.mutation-test }}
          MUTATION_SHARDS: ${{ needs.mutation-plan.outputs.mutation-shards }}
          MUTATION_SHARD: ${{ matrix.shard }}/${{ needs.mutation-plan.outputs.mutation-shards }}
          MUTATION_WINDOWS: ${{ needs.mutation-plan.outputs.mutation-windows }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          MUTATION_PLAN: ${{ runner.temp }}/mutation-plan/mutation-plan.json
          MUTATION_LIST: ${{ runner.temp }}/mutation-plan/mutants-list.json
        run: rust-gate mutants
      - name: Upload raw shard outcomes and identity receipt
        id: mutation-worker-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-mutants-${{ matrix.shard }}-of-${{ needs.mutation-plan.outputs.mutation-shards }}
          path: |
            ${{ runner.temp }}/mutants/mutants.out/
            ${{ runner.temp }}/rust-reports/mutants.json
            ${{ runner.temp }}/rust-reports/mutants.txt
            ${{ runner.temp }}/rust-reports/mutants-shard.json
          if-no-files-found: error
          retention-days: 7
  mutation-engine:
    name: Engine shard ${{ matrix.shard }} of ${{ needs.mutation-plan.outputs.mutation-engine-shards }}
    needs:
      - mutation-plan
    if: ${{ needs.mutation-plan.result == 'success' && needs.mutation-plan.outputs.mutation-test == 'true' && needs.mutation-plan.outputs.mutation-engine-count != '0' }}
    strategy:
