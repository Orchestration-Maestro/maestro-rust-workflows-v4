            cargo-nextest windows nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-x86_64-pc-windows-msvc.zip 0fa689815c8157e4633225b6b173184b3d546eb6ffb754c3d0e6ea5973284a20 zip cargo-nextest.exe
            jaq windows 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-pc-windows-msvc.exe 7b2f5153d11118c3ccff01859743e09842cabc42ba08f8876489c1be30d1d08d file jaq.exe
