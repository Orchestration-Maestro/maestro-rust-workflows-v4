        with:
          name: ${{ needs.checks.outputs.artifact-name }}-reports
          path: ${{ github.workspace }}/rust-reports/
          if-no-files-found: error
          retention-days: 7
  portability:
    name: Portability on ${{ matrix.runner }}
    # Planning validated the same directory and toolchain, so checks need not finish.
    needs:
      - mutation-plan
    if: ${{ needs.mutation-plan.outputs.platforms != '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.mutation-plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.mutation-plan.outputs.toolchain }}
    # These run defaults replace the workflow's, so Bash is named again: on
    # Windows the default shell is PowerShell.
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.mutation-plan.outputs.directory }}
    steps:
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build and test
        run: cargo test --locked --workspace
  # The uploads run only when no workflow called this one: in a repository's
  # own context, from the organization's ruleset. Every caller still grants
  # their scopes, which GitHub checks at startup even for a skipped job. The
  # job id `upload` keeps the code scanning configuration the retired callers
  # recorded on each default branch, `.github/workflows/ci.yml:upload`.
  # A merge group's commit is the one the default branch moves to, the only
  # branch a repository's merge-queue ruleset queues, so both uploads file it
  # there: the baseline each pull request compares against. A merge group
  # waits for the portability legs and uploads nothing when one failed: its
  # commit never lands. A pull request uploads whatever they say.
  upload:
    name: Upload Clippy and secret-scan SARIF
    needs:
      - checks
      - portability
      - mutation-summary
      - release
    # A fork pull request's token cannot write security events; its SARIF
    # stays in the reports artifact.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.release.result == 'success' && ((needs.checks.outputs.mutation-mode != 'sharded' && needs.checks.outputs.mutation-engine-count == '0' && needs.checks.outputs.mutation-engine-default-count == '0' && needs.checks.outputs.mutation-host-count == '0') || needs.mutation-summary.result == 'success') && (github.event_name != 'merge_group' || needs.portability.result == 'success' || needs.portability.result == 'skipped') && inputs.artifact-key == '' && github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    steps:
      - name: Download this run's reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.checks.outputs.artifact-name }}-reports
          path: reports
      # A repository that sets `sarif-reports = false` writes none.
      - name: Upload Clippy findings
        if: ${{ hashFiles('reports/clippy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: reports/clippy.sarif
          category: clippy
          ref: ${{ github.event.merge_group && format('refs/heads/{0}', github.event.repository.default_branch) || '' }}
          sha: ${{ github.event.merge_group.head_sha }}
      - name: Upload secret-scan findings
        if: ${{ hashFiles('reports/secrets.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: reports/secrets.sarif
          category: gitleaks
          ref: ${{ github.event.merge_group && format('refs/heads/{0}', github.event.repository.default_branch) || '' }}
          sha: ${{ github.event.merge_group.head_sha }}
  # Advisory: the checks job holds coverage to its floors, so a Codecov
  # outage fails no run. The CLI is a release asset verified by digest,
  # never a download the action would run unverified once errors pass.
  coverage:
    name: Upload coverage and test results to Codecov
    needs:
      - checks
      - portability
      - mutation-summary
      - release
    # A fork pull request gets no OIDC token; its reports stay in the reports
    # artifact.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.release.result == 'success' && ((needs.checks.outputs.mutation-mode != 'sharded' && needs.checks.outputs.mutation-engine-count == '0' && needs.checks.outputs.mutation-engine-default-count == '0' && needs.checks.outputs.mutation-host-count == '0') || needs.mutation-summary.result == 'success') && (github.event_name != 'merge_group' || needs.portability.result == 'success' || needs.portability.result == 'skipped') && inputs.artifact-key == '' && github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # log in to Codecov with OIDC instead of a stored token
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      # Codecov maps the report's absolute paths onto this checkout's files.
      - name: Checkout consumer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the Codecov CLI
        run: rust-gate install-tools
        env:
          TOOLS: codecov codecov/codecov-cli/releases/download/v11.3.1/codecovcli_linux ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
      - name: Download this run's reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.checks.outputs.artifact-name }}-reports
          path: reports
      - name: Upload line coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: reports/coverage.lcov
          report_type: coverage
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
          binary: ${{ runner.temp }}/rust-tools/bin/codecov
          override_branch: ${{ github.event.merge_group && github.event.repository.default_branch || '' }}
          override_commit: ${{ github.event.merge_group.head_sha }}
      - name: Upload test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: reports/tests.xml
          report_type: test_results
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
          binary: ${{ runner.temp }}/rust-tools/bin/codecov
          override_branch: ${{ github.event.merge_group && github.event.repository.default_branch || '' }}
          override_commit: ${{ github.event.merge_group.head_sha }}
  gate:
    name: Required Rust CI
    needs:
      - mutation-plan
      - checks
      - release
      - portability
      - mutations
      - mutation-summary
      - mutation-windows
      - mutation-host
      - mutation-engine
      - mutation-engine-default
    if: ${{ always() && (inputs.artifact-key != '' || github.repository_id != '1382744803') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      artifact-id: ${{ steps.required.outcome == 'success' && needs.release.outputs.artifact-id || '' }}
      artifact-name: ${{ steps.required.outcome == 'success' && needs.release.outputs.artifact-name || '' }}
      revision: ${{ steps.required.outcome == 'success' && needs.release.outputs.revision || '' }}
    env:
      PROJECT: ${{ github.workspace }}
      REPORTS: ${{ github.workspace }}/final-reports
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Install the pinned JSON reader
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Download canonical reports for the final scorecard
        id: final-reports-download
        if: ${{ always() && needs.mutation-plan.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-reports
          path: ${{ github.workspace }}/final-reports
      - name: Finalize quality scorecard
        id: release-scorecard-finalize
        if: ${{ always() && steps.final-reports-download.outcome == 'success' }}
        run: rust-gate scorecard-finalize
        env:
          RELEASE_FINALIZE: 'true'
          RELEASE_RESULT: ${{ needs.release.result }}
          OUT_BUILD: ${{ needs.release.outputs.out-build }}
          OUT_HARDENING: ${{ needs.release.outputs.out-hardening }}
          OUT_STAGE: ${{ needs.release.outputs.out-stage }}
      - name: Upload final scorecard
        id: final-scorecard-upload
        if: ${{ always() && steps.release-scorecard-finalize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-final-scorecard
          path: |
            ${{ github.workspace }}/final-reports/scorecard.json
            ${{ github.workspace }}/final-reports/scorecard.md
            ${{ github.workspace }}/final-reports/scorecard.svg
          if-no-files-found: error
          retention-days: 7
      - name: Require every check
        id: required
        if: ${{ always() }}
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          OUT_BUILD: ${{ needs.release.outputs.out-build }}
          OUT_HARDENING: ${{ needs.release.outputs.out-hardening }}
          OUT_STAGE: ${{ needs.release.outputs.out-stage }}
          FINAL_SCORECARD_RESULT: ${{ steps.final-scorecard-upload.outcome }}
          RESULT: ${{ needs.checks.result }}
          PORTABILITY: ${{ needs.portability.result }}
          RUNNERS: ${{ needs.checks.outputs.platforms }}
          MUTATION_TEST: ${{ needs.checks.outputs.mutation-test }}
          MUTATION_MODE: ${{ needs.checks.outputs.mutation-mode }}
          MUTATION_COUNT: ${{ needs.checks.outputs.mutation-count }}
          MUTATION_HOST_COUNT: ${{ needs.mutation-plan.outputs.mutation-host-count }}
          MUTATION_HOST_FILES: ${{ needs.mutation-plan.outputs.mutation-host-files }}
          HOST_MUTATIONS_RESULT: ${{ needs.mutation-host.result }}
          CHANGED_COVERAGE_STATE: ${{ needs.mutation-summary.outputs.changed-coverage-state }}
          MUTATION_SHARDS: ${{ needs.checks.outputs.mutation-shards }}
          MUTATION_MATRIX: ${{ needs.checks.outputs.mutation-matrix }}
          MUTATION_ATTEMPT: ${{ needs.checks.outputs.mutation-attempt }}
          INTERNAL_SHARD_SELFTEST: ${{ inputs.internal-shard-selftest || false }}
          MUTATION_ENGINE_COUNT: ${{ needs.checks.outputs.mutation-engine-count }}
          MUTATION_ENGINE_DEFAULT_COUNT: ${{ needs.checks.outputs.mutation-engine-default-count }}
          MUTATION_ENGINE_FILES: ${{ needs.checks.outputs.mutation-engine-files }}
          ENGINE_MUTATIONS_RESULT: ${{ needs.mutation-engine.result }}
          ENGINE_DEFAULT_MUTATIONS_RESULT: ${{ needs.mutation-engine-default.result }}
          MUTATION_WINDOWS: ${{ needs.checks.outputs.mutation-windows }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
          MUTATION_SUMMARY_RESULT: ${{ needs.mutation-summary.result }}
          WINDOWS_MUTATIONS_RESULT: ${{ needs.mutation-windows.result }}
        run: rust-gate required
