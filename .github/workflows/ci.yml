          MUTATION_ARTIFACT_NAME: ${{ needs.checks.outputs.artifact-name }}
          MUTATION_PLAN_DIR: ${{ runner.temp }}/checks-reports
          MUTATION_ARTIFACTS: ${{ runner.temp }}/mutation-shards
        run: rust-gate mutants-aggregate
