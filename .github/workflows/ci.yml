          COVERAGE: '90'
          COVERAGE_FEATURES: ${{ needs.mutation-plan.outputs.coverage-features }}
          ARTIFACT_KEY: engine-mutation
          LICENSE_POLICY: auto
          MUTATION_TEST: ${{ needs.mutation-plan.outputs.mutation-test }}
          MUTATION_SHARDS: '1'
          MUTATION_MUTANTS_PER_SHARD: ${{ needs.mutation-plan.outputs.mutation-mutants-per-shard }}
          MUTATION_WINDOWS: ${{ needs.mutation-plan.outputs.mutation-windows }}
          MUTATION_ENGINE_FILES: ${{ needs.mutation-plan.outputs.mutation-engine-files }}
