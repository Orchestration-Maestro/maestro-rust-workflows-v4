        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Checkout the exact consumer revision and first parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Configure private Cargo state for direct crates.io access
        run: rust-gate registry
      - name: Install the toolchain
        run: rust-gate tools
        env:
          REPORTS: ${{ runner.temp }}/rust-reports
      - name: Install the pinned JSON reader
        run: rust-gate install-tools
        env:
          REPORTS: ${{ runner.temp }}/rust-reports
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Download the complete immutable host plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
