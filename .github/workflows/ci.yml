          merge-multiple: false
      - name: Download inline default mutation outcomes
        if: ${{ always() && needs.checks.outputs.mutation-mode == 'inline' && (needs.checks.outputs.mutation-engine-count != '0' || needs.checks.outputs.mutation-engine-default-count != '0' || needs.mutation-plan.outputs.mutation-host-count != '0') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.checks.outputs.artifact-name }}-default-mutants
          path: ${{ runner.temp }}/checks-reports/mutants/mutants.out
      - name: Download immutable engine mutation plan
        if: ${{ always() && (needs.checks.outputs.mutation-engine-count != '0' || needs.checks.outputs.mutation-engine-default-count != '0') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.mutation-plan.outputs.artifact-name }}-plan
          path: ${{ runner.temp }}/engine-plan
      - name: Download every engine mutation shard
        if: ${{ always() && needs.checks.outputs.mutation-engine-count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
