    timeout-minutes: 10
    permissions: {}
    env:
      CARGO_MUTANTS_VERSION: '27.1.0'
      PROJECT: ${{ github.workspace }}
      REPORTS: ${{ github.workspace }}/rust-reports
    steps:
      - name: Checkout the gate at this workflow's commit
        id: mutation-summary-gate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        id: mutation-summary-gate-build
        uses: ./.github/actions/gate
      - name: Install the pinned JSON reader
        id: mutation-summary-jaq
        run: rust-gate install-tools
        env:
          TOOLS: jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
      - name: Download checks reports and the complete plan
        id: mutation-summary-checks-download
        if: ${{ always() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.checks.outputs.artifact-name }}-checks-reports
          path: ${{ runner.temp }}/checks-reports
      - name: Download every expected shard without flattening
        id: mutation-summary-shards-download
        if: ${{ always() && needs.checks.outputs.mutation-mode == 'sharded' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ needs.checks.outputs.artifact-name }}-mutants-*
