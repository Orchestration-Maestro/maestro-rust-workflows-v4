name: Host executor qualification

"on":
  pull_request:
    paths:
      - '.github/workflows/host-executor-fixture.yml'
      - 'gate/src/steps/mutation_testing/**'
      - 'tests/ci/host_executor*'
      - 'tests/harness/host_execution.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-executor-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-host:
    name: Real discovery and caught/surviving execution
    if: ${{ github.event_name != 'pull_request_target' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      PROJECT: ${{ github.workspace }}
    steps:
      - name: Checkout the gate at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Build the gate
        uses: ./.github/actions/gate
      - name: Install pinned discovery and JSON tools
        run: rust-gate install-tools
        env:
          REPORTS: ${{ runner.temp }}/host-fixture-tools
          TOOLS: |
            jaq 01mf02/jaq/releases/download/v3.1.1/jaq-x86_64-unknown-linux-gnu 5922c7b67d9bd6841d6676d1f954410c6bf04b47203dcb661c4f052dfef7f454
            cargo-mutants sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e cargo-mutants
      - name: Prove a caught mutation and a red survivor partition
        timeout-minutes: 35
        env:
          WORKFLOW_REVISION: ${{ job.workflow_sha }}
          HOST_QUALIFICATION_REPORTS: ${{ runner.temp }}/host-qualification
        run: cargo test --manifest-path tests/Cargo.toml --locked --test workflows ci::host_executor::host_executor_retains_survivors_and_failure_artifacts_without_credit -- --exact --nocapture
      - name: Independently clean retained fixture scopes
        if: ${{ always() }}
        timeout-minutes: 5
        env:
          HOST_QUALIFICATION_REPORTS: ${{ runner.temp }}/host-qualification
        run: cargo test --manifest-path tests/Cargo.toml --locked --test workflows ci::host_executor::hosted_fixture_cleanup_collects_each_retained_scope_independently -- --exact --nocapture
      - name: Retain receipts and cleanup evidence on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: host-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-qualification/
          if-no-files-found: error
          retention-days: 7
